name: Windows bounded verification

# Standard public-repository runner only; no paid/larger runners or model calls.
on:
  workflow_dispatch:
  pull_request:
    paths-ignore: ['**/*.md', 'evidence/**']
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'evidence/**']

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node 24
        with:
          python-version: '3.12'
      - name: Canonical local fixture temporary directory
        run: |
          # Hosted Windows TEMP may contain RUNNER~1. Alias refusal is a safety
          # contract, so use a known canonical directory rather than relax it.
          $fixtureTemporaryDirectory = Join-Path $env:RUNNER_TEMP 'headroom-fixtures'
          if ($fixtureTemporaryDirectory.Contains('~')) { throw 'Runner temp must be canonical' }
          New-Item -ItemType Directory -Path $fixtureTemporaryDirectory -Force | Out-Null
          "TEMP=$fixtureTemporaryDirectory" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$fixtureTemporaryDirectory" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Add native compiler for this isolated runner
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $compilerDirectory = Join-Path $env:MSYS2_LOCATION 'ucrt64\bin'
          $compilerDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Strict native build
        run: .\build.ps1
      - name: Static analysis
        run: python tests/analyze.py
      - name: Serial bounded tests
        run: python tests/verify.py
      - name: Offline package-format tests
        run: python tools/test_package_local.py
      - name: Protected-peer checkpoint demonstration
        run: python tests/fleet_demo.py

# No credentials, real agent inference, host-OOM tests or artifact uploads.
