name: Windows bounded verification

# Standard public-repository runner only; no paid/larger runners or model calls.
on:
  workflow_dispatch:
  pull_request:
    paths-ignore: ['**/*.md', 'evidence/**']
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'evidence/**']

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Add native compiler for this isolated runner
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $compilerDirectory = Join-Path $env:MSYS2_LOCATION 'ucrt64\bin'
          $compilerDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Strict native build
        run: .\build.ps1
      - name: Static analysis
        run: python tests/analyze.py
      - name: Serial bounded tests
        run: python tests/verify.py
      - name: Offline package-format tests
        run: python tools/test_package_local.py
      - name: Protected-peer checkpoint demonstration
        run: python tests/fleet_demo.py

# No credentials, real agent inference, host-OOM tests or artifact uploads.
