name: Reproducible bug
description: Report a bounded correctness problem with synthetic data
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never attach credentials, private histories, raw logs/state or real command arguments. For sensitive issues see SECURITY.md.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Windows version, Python/compiler versions, release or commit
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal synthetic reproduction
      description: Exact commands and bounded fake inputs; never induce host OOM or terminate unrelated programs
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected and actual result
      description: Include sanitized error codes or portable evidence, not private raw output
    validations:
      required: true
